name: PoseFeedback
options:
  bundleIdPrefix: com.posefeedback
  deploymentTarget:
    iOS: "17.0"
targets:
  PoseFeedback:
    type: application
    platform: iOS
    sources:
      - PoseFeedback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.posefeedback.app
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: PoseFeedback/Info.plist
      properties:
        CFBundleDisplayName: 운동 피드백
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iOS 는 기본적으로 http(비 HTTPS)를 막으므로 localhost/LAN 접속을 허용
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
