name: PoseFeedback
options:
  bundleIdPrefix: com.posefeedback
  deploymentTarget:
    iOS: "17.0"
targets:
  PoseFeedback:
    type: application
    platform: iOS
    sources:
      - PoseFeedback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.posefeedback.app
        TARGETED_DEVICE_FAMILY: 1
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PoseFeedback/Info.plist
      properties:
        CFBundleDisplayName: 운동 피드백
        # 런치 화면: 브랜드 색 배경 + 중앙 로고
        UILaunchScreen:
          UIColorName: BrandColor
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # iOS 는 기본적으로 http(비 HTTPS)를 막으므로 localhost/LAN 접속을 허용
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 앱 내 촬영용 권한 설명 (없으면 카메라 접근 시 크래시)
        NSCameraUsageDescription: 운동 영상을 촬영하기 위해 카메라를 사용합니다.
        NSMicrophoneUsageDescription: 운동 영상 촬영 시 소리를 함께 녹화합니다.
