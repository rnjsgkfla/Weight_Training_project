# 로컬 개발과 서버(Lightsail) 배포에 같은 구성을 쓴다: API + Postgres
#   cp .env.example .env   # 비밀값 채우기
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pose
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: pose
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pose -d pose"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://pose:${POSTGRES_PASSWORD}@db:5432/pose
      JWT_SECRET: ${JWT_SECRET:?.env 에 JWT_SECRET 을 설정하세요}
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media          # 기록 비교 이미지 (컨테이너를 다시 만들어도 유지)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
